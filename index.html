<!doctype html>
<html lang="en" style="background-color: #000000;">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        var isViteMsg = function(arg) {
          if (!arg) return false;
          var str = typeof arg === 'string' ? arg : (arg.message || arg.stack || String(arg));
          return typeof str === 'string' && (str.indexOf('[vite]') !== -1 || str.indexOf('vite-hmr') !== -1 || str.indexOf('websocket') !== -1 || str.indexOf('WebSocket') !== -1 || str.indexOf('@vite') !== -1);
        };
        var origError = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isViteMsg(arguments[i])) return;
          }
          return origError.apply(console, arguments);
        };
        var origWarn = console.warn;
        console.warn = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isViteMsg(arguments[i])) return;
          }
          return origWarn.apply(console, arguments);
        };
        var origInfo = console.info;
        console.info = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isViteMsg(arguments[i])) return;
          }
          return origInfo.apply(console, arguments);
        };
        var origDebug = console.debug;
        console.debug = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isViteMsg(arguments[i])) return;
          }
          return origDebug.apply(console, arguments);
        };
        window.addEventListener('unhandledrejection', function(event) {
          if (event && isViteMsg(event.reason)) {
            event.preventDefault();
            event.stopPropagation();
          }
        }, true);
        window.addEventListener('error', function(event) {
          if (event && (isViteMsg(event.message) || isViteMsg(event.filename) || isViteMsg(event.error))) {
            event.preventDefault();
            event.stopPropagation();
          }
        }, true);
      })();
    </script>
